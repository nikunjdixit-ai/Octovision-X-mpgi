<!DOCTYPE html>
<html lang="en">
<head>
<!--
==============================================================================
OctoVIZN x MPGI | License Edition
==============================================================================
This uses the same loader markup, loader CSS and fonts as the main
OctoVIZN site (design.css): the #loader / #loader-text / .loader-panels
pattern and the Deltha, Rajdhani and JetBrains Mono type families. Nothing
from the homepage layout beyond that has been carried over, and no separate
logo icon has been added anywhere on this screen.

The Deltha font file is loaded from fonts/Deltha.otf, the same relative
location design.css already points to. Place this index.html next to a
fonts folder containing Deltha.otf, or the type stack falls back to a
plain sans serif automatically.

Flow:
  1. Loader plays once on every launch, exactly like the homepage.
  2. No saved name and password yet, first visit screen collects a name
     and a password, saves both to localStorage, then opens howtouse.html
  3. Name and password already saved, welcome back screen asks for the
     password only, and on a correct match opens dashboard.html

One line to edit per site install: SITE_NAME, near the top of the
script at the bottom of this file.
==============================================================================
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OctoVIZN x MPGI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  @font-face{
    font-family:"Deltha";
    src:url("fonts/Deltha.otf") format("opentype");
    font-weight:normal;
    font-style:normal;
  }

  :root{
    --black:#08090b;
    --pure-black:#000;
    --white:#f4f4f2;
    --blue:#26417a;
    --blue-light:#3d5da3;
    --gray:#84868c;
    --hairline:rgba(8,9,11,0.14);
    --danger:#a4342a;
    --font-display:"Deltha", sans-serif;
    --font-body:'Rajdhani', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --ease:cubic-bezier(.65,0,.35,1);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; }
  body{
    background:var(--white);
    color:var(--pure-black);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  body.lock{ overflow:hidden; height:100vh; }
  button{ font-family:inherit; cursor:pointer; background:none; border:none; color:inherit; }
  ::selection{ background:var(--blue-light); color:var(--white); }
  :focus-visible{ outline:2px solid var(--blue-light); outline-offset:3px; }

  /* ============== loader, kept exactly as in design.css ============== */
  #loader{
    position:fixed; inset:0; z-index:9999;
    background:var(--black);
    display:flex; align-items:center; justify-content:center;
  }
  #loader-text{
    font-family:var(--font-display);
    font-size:clamp(14px,2vw,20px);
    letter-spacing:0.35em;
    color:var(--white);
    opacity:0;
    text-transform:uppercase;
  }
  #loader-text.show{ animation:loaderFade 1.8s var(--ease) forwards; }
  @keyframes loaderFade{
    0%{ opacity:0; letter-spacing:0.6em; }
    30%{ opacity:1; letter-spacing:0.35em; }
    70%{ opacity:1; }
    100%{ opacity:0; letter-spacing:0.2em; }
  }
  .loader-panels{ position:fixed; inset:0; z-index:9998; display:flex; pointer-events:none; }
  .loader-panel{
    flex:1; background:var(--black);
    border-right:1px solid rgba(244,244,242,0.04);
    transform:translateY(0);
    transition:transform 0.9s var(--ease);
  }
  .loader-panel:last-child{ border-right:none; }
  .loader-panels.reveal .loader-panel{ transform:translateY(-101%); }
  .loader-panels.reveal .loader-panel:nth-child(1){ transition-delay:0.05s; }
  .loader-panels.reveal .loader-panel:nth-child(2){ transition-delay:0.22s; }
  .loader-panels.reveal .loader-panel:nth-child(3){ transition-delay:0.39s; }
  .loader-panels.reveal .loader-panel:nth-child(4){ transition-delay:0.56s; }
  .loader-panels.done{ display:none; }
  #loader.hide{ display:none; }

  /* ============== everything below is new, for this screen only ============== */

  .nav-logo{
    font-family:var(--font-display);
    font-size:14px; letter-spacing:0.26em; color:var(--pure-black);
    white-space:nowrap;
  }

  main{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:40px 24px;
    opacity:0; transform:translateY(10px);
    transition:opacity 0.6s var(--ease) 0.1s, transform 0.6s var(--ease) 0.1s;
  }
  main.revealed{ opacity:1; transform:translateY(0); }

  .stage{
    width:100%; max-width:420px;
    display:flex; flex-direction:column; align-items:center; gap:26px;
  }

  .card{
    width:100%;
    background:#fff;
    border:1px solid var(--hairline);
    padding:38px 34px 32px;
  }
  .card.shake{ animation:shake 0.4s var(--ease); }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-6px); }
    75%{ transform:translateX(6px); }
  }

  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--blue); margin-bottom:12px;
  }

  h1{
    margin:0 0 10px;
    font-family:var(--font-body);
    font-weight:600; font-size:24px; line-height:1.25;
    color:var(--pure-black);
  }

  .note{
    margin:0 0 26px;
    font-size:15px; line-height:1.6; font-weight:500;
    color:#45464a;
  }

  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-size:13px; font-weight:600;
    color:var(--pure-black); margin-bottom:6px;
  }
  .field-row{ position:relative; display:flex; align-items:center; }
  .field input{
    width:100%; padding:12px 14px; font-size:15px;
    color:var(--pure-black);
    background:var(--white);
    border:1px solid var(--hairline);
    outline:none;
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .field input:focus{ border-color:var(--blue-light); background:#fff; }
  .field input.with-toggle{ padding-right:42px; }

  .toggle-visibility{
    position:absolute; right:8px;
    width:28px; height:28px;
    display:flex; align-items:center; justify-content:center;
    color:var(--gray);
  }
  .toggle-visibility:hover{ color:var(--pure-black); }
  .toggle-visibility svg{ width:17px; height:17px; }

  .form-error{
    display:none; align-items:center; gap:7px;
    font-size:13px; color:var(--danger);
    margin:-4px 0 16px;
  }
  .form-error.show{ display:flex; }
  .form-error svg{ width:14px; height:14px; flex:none; }

  .btn-primary{
    width:100%; padding:13px 16px;
    background:var(--pure-black); color:var(--white);
    font-size:15px; font-weight:600; letter-spacing:0.01em;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:background 0.2s ease, transform 0.2s ease;
  }
  .btn-primary:hover{ background:var(--blue); transform:translateY(-1px); }
  .btn-primary svg{ width:14px; height:14px; }

  .fine-print{
    margin-top:16px;
    font-family:var(--font-mono);
    font-size:11px; line-height:1.6; letter-spacing:0.01em;
    color:var(--gray); text-align:center;
  }

  .reset-link{
    margin-top:18px; text-align:center;
    font-size:13px; color:#45464a;
  }
  .reset-link button{
    color:var(--blue); font-size:13px; font-weight:600;
    text-decoration:underline; text-underline-offset:2px;
  }

  @media (max-height:640px){
    .card{ padding:26px 26px 22px; }
    h1{ font-size:21px; }
    .note{ margin-bottom:18px; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }
</style>
</head>
<body class="lock">

<div id="loader">
  <div id="loader-text">Welcome to OctoVIZN x MPGI</div>
</div>
<div class="loader-panels" id="loaderPanels">
  <div class="loader-panel"></div>
  <div class="loader-panel"></div>
  <div class="loader-panel"></div>
  <div class="loader-panel"></div>
</div>

<main id="app">
  <div class="stage">
    <!-- <div class="nav-logo">OctoVIZN x MPGI</div> -->
    <section class="card" id="authCard"><!-- filled by the script below --></section>
  </div>
</main>

<script>
(function(){

  /* One line to edit per site install. Shows up in the setup note. */
  const SITE_NAME = "OctoVIZN x MPGI"; // License edition for MPGI

  const FIRST_RUN_DESTINATION = "howtouse.html";
  const RETURNING_DESTINATION = "dashboard.html";

  const KEY_NAME = "trace_user_name";
  const KEY_PASS = "trace_user_pass";

  const authCard     = document.getElementById("authCard");
  const loader       = document.getElementById("loader");
  const loaderText   = document.getElementById("loader-text");
  const loaderPanels = document.getElementById("loaderPanels");
  const app          = document.getElementById("app");

  const ICON_EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
  const ICON_EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a15.6 15.6 0 0 1 3.4 4.3M6.5 6.6C4 8.3 2 12 2 12s3.6 7 10 7c1.4 0 2.7 0.3 3.8 0.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  const ICON_WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v5"/><circle cx="12" cy="16" r="0.6" fill="currentColor" stroke="none"/></svg>';
  const ICON_ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17L17 7M7 7h10v10"/></svg>';

  function wirePasswordToggle(btn, input){
    btn.addEventListener("click", function(){
      const showing = input.type === "text";
      input.type = showing ? "password" : "text";
      btn.innerHTML = showing ? ICON_EYE : ICON_EYE_OFF;
    });
  }

  function showError(el, message){
    el.querySelector("span").textContent = message;
    el.classList.add("show");
  }
  function hideError(el){ el.classList.remove("show"); }

  function shakeCard(){
    const card = document.getElementById("authCard");
    card.classList.remove("shake");
    void card.offsetWidth;
    card.classList.add("shake");
  }

  function escapeHtml(str){
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  function renderFirstRun(){
    authCard.innerHTML =
      '<div class="eyebrow">Getting started</div>' +
      '<h1>Set up the dashboard</h1>' +
      '<p class="note">This build is made for ' + escapeHtml(SITE_NAME) + '. There is no account, and nothing leaves this computer. Your name and password stay here only, so the dashboard can greet you and stay private if this machine is shared.</p>' +
      '<form id="setupForm" novalidate>' +
        '<div class="field">' +
          '<label for="nameInput">Your name</label>' +
          '<div class="field-row"><input id="nameInput" type="text" autocomplete="off" placeholder="e.g. Ananya Rao" maxlength="40"></div>' +
        '</div>' +
        '<div class="field">' +
          '<label for="passInput">Create a password</label>' +
          '<div class="field-row">' +
            '<input id="passInput" class="with-toggle" type="password" autocomplete="new-password" placeholder="At least 4 characters">' +
            '<button type="button" class="toggle-visibility" id="passToggle" aria-label="Show password">' + ICON_EYE + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="field">' +
          '<label for="confirmInput">Confirm password</label>' +
          '<div class="field-row">' +
            '<input id="confirmInput" class="with-toggle" type="password" autocomplete="new-password" placeholder="Type it again">' +
            '<button type="button" class="toggle-visibility" id="confirmToggle" aria-label="Show password">' + ICON_EYE + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="form-error" id="setupError">' + ICON_WARN + '<span></span></div>' +
        '<button type="submit" class="btn-primary">Continue ' + ICON_ARROW + '</button>' +
      '</form>';

    const form = document.getElementById("setupForm");
    const nameInput = document.getElementById("nameInput");
    const passInput = document.getElementById("passInput");
    const confirmInput = document.getElementById("confirmInput");
    const errorBox = document.getElementById("setupError");

    wirePasswordToggle(document.getElementById("passToggle"), passInput);
    wirePasswordToggle(document.getElementById("confirmToggle"), confirmInput);

    form.addEventListener("submit", function(e){
      e.preventDefault();
      hideError(errorBox);

      const name = nameInput.value.trim();
      const pass = passInput.value;
      const confirm = confirmInput.value;

      if (!name){
        showError(errorBox, "Enter your name to continue.");
        shakeCard(); nameInput.focus(); return;
      }
      if (pass.length < 4){
        showError(errorBox, "Password should be at least 4 characters.");
        shakeCard(); passInput.focus(); return;
      }
      if (pass !== confirm){
        showError(errorBox, "Passwords do not match.");
        shakeCard(); confirmInput.focus(); return;
      }

      localStorage.setItem(KEY_NAME, name);
      localStorage.setItem(KEY_PASS, pass);
      window.location.href = FIRST_RUN_DESTINATION;
    });

    nameInput.focus();
  }

  function renderReturning(name){
    authCard.innerHTML =
      '<div class="eyebrow">Password required</div>' +
      '<h1>Hi ' + escapeHtml(name) + '</h1>' +
      '<p class="note">Enter your password to open your dashboard.</p>' +
      '<form id="unlockForm" novalidate>' +
        '<div class="field">' +
          '<label for="unlockPass">Password</label>' +
          '<div class="field-row">' +
            '<input id="unlockPass" class="with-toggle" type="password" autocomplete="current-password">' +
            '<button type="button" class="toggle-visibility" id="unlockToggle" aria-label="Show password">' + ICON_EYE + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="form-error" id="unlockError">' + ICON_WARN + '<span></span></div>' +
        '<button type="submit" class="btn-primary">Continue ' + ICON_ARROW + '</button>' +
      '</form>' +
      '<div class="reset-link">Not ' + escapeHtml(name) + '? <button type="button" id="resetBtn">Reset this device</button></div>';

    const form = document.getElementById("unlockForm");
    const passInput = document.getElementById("unlockPass");
    const errorBox = document.getElementById("unlockError");

    wirePasswordToggle(document.getElementById("unlockToggle"), passInput);

    form.addEventListener("submit", function(e){
      e.preventDefault();
      hideError(errorBox);

      const stored = localStorage.getItem(KEY_PASS);
      if (passInput.value === stored){
        window.location.href = RETURNING_DESTINATION;
      } else {
        showError(errorBox, "That password does not match. Try again.");
        shakeCard();
        passInput.value = "";
        passInput.focus();
      }
    });

    document.getElementById("resetBtn").addEventListener("click", function(){
      const ok = window.confirm("This clears the saved name and password from this computer. Continue?");
      if (ok){
        localStorage.removeItem(KEY_NAME);
        localStorage.removeItem(KEY_PASS);
        renderFirstRun();
      }
    });

    passInput.focus();
  }

  const savedName = localStorage.getItem(KEY_NAME);
  const savedPass = localStorage.getItem(KEY_PASS);

  if (savedName && savedPass){
    loaderText.textContent = "Welcome back";
    renderReturning(savedName);
  } else {
    renderFirstRun();
  }

  /* Same loader sequence as the homepage: the text fades in and out first.
     The solid #loader layer sits ABOVE the four panels, so it has to be
     taken out of the way (display:none, no transition, so it is seamless
     since the panels underneath are the same black) before the panels get
     their .reveal class, or the upward wipe plays invisibly behind it. */
  setTimeout(function(){ loaderText.classList.add("show"); }, 60);

  setTimeout(function(){
    loader.classList.add("hide");
    loaderPanels.classList.add("reveal");
  }, 1900);

  setTimeout(function(){
    loaderPanels.classList.add("done");
    document.body.classList.remove("lock");
    app.classList.add("revealed");
  }, 3360);

})();
</script>
</body>
</html>
